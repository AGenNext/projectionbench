name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run tests
        run: pytest -q

      - name: Run example scenario
        run: projectionbench run scenarios/example-biomaterial.json --out evaluation.example.jsonld

      - name: Upload example evaluation artifact
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-example-jsonld
          path: evaluation.example.jsonld
