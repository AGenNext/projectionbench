[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projectionbench"
version = "0.1.0"
description = "Generic theory and ProjectionBench evaluation framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AGenNext" }]
dependencies = []

[project.scripts]
projectionbench = "projectionbench.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
